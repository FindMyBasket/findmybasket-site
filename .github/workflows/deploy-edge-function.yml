name: Deploy an edge function

# WHY THIS EXISTS. On 19 August 2026 an edge function was overwritten with a placeholder by a
# deploy path that takes file CONTENT inline rather than a path. Restoring it by re-transmitting
# 554 lines by hand would have risked a transcription error in production code.
#
# THIS DEPLOYS FROM THE REPOSITORY, which is the source of truth, so the deployed function is
# by construction the file that was reviewed and committed. There is no retyping step to get
# wrong. Any inline-content deploy path should be treated as a last resort.
#
# Manual only. Deliberately not scheduled: an edge function should change when someone decides
# it should, not on a timer.

"on":
  workflow_dispatch:
    inputs:
      function:
        description: Function slug under supabase/functions/
        required: true
        default: monitor-retailer-feeds

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1
          fi
          FN="${{ github.event.inputs.function }}"
          test -f "supabase/functions/${FN}/index.ts" || { echo "::error::no such function ${FN}"; exit 1; }
          echo "Deploying ${FN} ($(wc -l < "supabase/functions/${FN}/index.ts") lines) from the repository"
          supabase functions deploy "${FN}" --project-ref "${PROJECT_REF}"
