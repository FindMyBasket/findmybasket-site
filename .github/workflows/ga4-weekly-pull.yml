name: ga4-weekly-pull

# Step 4 of the dashboard build: pull GA4 weekly metrics into
# public.metrics_ga4_weekly.
#
# Runs here rather than pg_cron-to-edge because
# GOOGLE_APPLICATION_CREDENTIALS_JSON lives in GitHub Actions and nowhere else,
# and copying it into Supabase to suit a scheduling preference would create a
# second unverified copy of a credential. That is the AWIN_API_KEY / SKEW_IGNORE
# pattern this project has already decided not to repeat.
#
# ARMED. The `schedule:` block below is LIVE (Mondays 06:00 UTC).
#
# This comment previously said "NOT SCHEDULED YET, DELIBERATELY... commented out" and kept
# saying it after the block was uncommented. On 15 August it was read as evidence that the
# puller was unarmed, which was wrong, and only the run history settled it.
# A COMMENT THAT CONTRADICTS THE CODE BELOW IT IS WORSE THAN NO COMMENT: it is what a
# reader checks INSTEAD of the code. The three acts below are kept as the record of how it
# was armed, not as a statement that it has not been.
# This job WRITES to production, and nothing in this repository has ever seen it
# run against the real API: it cannot be run locally (the credential is not
# available outside Actions) and the token here cannot dispatch it
# (`gh workflow run` returns 403, no actions: write). Arming a writer that has
# never executed, on a timer, is how a bad row lands unattended at 06:00 on a
# Monday.
#
# SEQUENCE TO ARM IT:
#   1. Dispatch manually with dry_run = true. Read the printed table. Check the
#      NULL pattern against the boundaries, and that the by-network self-check
#      reports [ok].
#   2. Dispatch with dry_run = false. Confirm the rows in metrics_ga4_weekly.
#   3. Only then uncomment `schedule:` in a PR of its own, so arming it is a
#      reviewable act rather than a side effect of building it.
#
# HELD 29 July: GitHub Actions minutes are close to exhausted, so step 1 is
# deferred until they reset. Unarmed with an empty table is the correct resting
# state, not a stalled one.
#
# WHEN YOU DO DISPATCH, AND IT 403s, CHECK THE QUOTA BEFORE THE PERMISSIONS.
# An Actions quota 403 is indistinguishable from a token-scope 403 at the API:
# both are "Resource not accessible by integration". This session spent effort
# concluding that `gh workflow run` fails structurally for want of
# `actions: write`, which may be true, may be quota, or may have been both at
# different times. It is the same shape as convention 6 in
# supabase/migrations/README.md: an answer that looks definitive and was
# produced by a check that cannot distinguish the two causes.
#
# The four scheduled workflows in this directory (refresh-debenhams,
# secret-divergence-check, sync-adg-feed, sync-bb-feed) are what consume the
# quota unattended, and three of them feed the import path. Their health is
# verifiable WITHOUT Actions, from retailer_import_config.last_import_status and
# last_imported_at in Supabase, which is the right way to check them while
# minutes are scarce.
#
# Required secrets: GOOGLE_APPLICATION_CREDENTIALS_JSON, SUPABASE_URL,
# SUPABASE_SERVICE_KEY. All three already exist for other workflows.

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          true prints the rows and writes nothing. Leave true until the output
          has been read at least once.
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      weeks:
        description: >-
          Trailing ISO weeks to re-pull, 1 to 4. GA4 allows at most four date
          ranges per request, and the brief requires at least three to absorb
          the 24-48h processing lag.
        required: false
        default: '4'
        type: string

  # Mondays 06:00 UTC, after the ISO week closes. The trailing re-pull is what
  # handles GA4's processing lag, so the previous week being provisional at this
  # hour is expected and self-correcting rather than a reason to run later.
  #
  # ARMED 13 August 2026, step 3 of the sequence in the header. Steps 1 and 2 ran
  # that day: the dry run was read, the real run wrote four weeks, and the rows
  # were confirmed in metrics_ga4_weekly. Arming is its own PR by design, so that
  # it is a reviewable act rather than a side effect of building the puller.
  #
  # WHY IT WAS NOT DELAYED FURTHER. The puller reaches four TRAILING weeks — a GA4
  # constraint, at most four date ranges per request, not a setting. Any week this
  # is not armed for falls out of range and needs a different tool to recover. A
  # week of silence costs series permanently; the open question it would have
  # waited on (see platform_changes id 34) is prevented by a boundary row instead.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  # Two concurrent runs would upsert the same week_start rows against each other.
  # Harmless given merge-duplicates, but it makes the logs impossible to read
  # when one of them is wrong.
  group: ga4-weekly-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The week and boundary logic decides which weeks are written and which
      # are withheld, so it runs before anything touches production. A failure
      # here means the arithmetic is wrong, and a puller with wrong week
      # arithmetic writes numbers filed under the wrong dates, which is worse
      # than not running.
      - name: Test the week and boundary helpers
        run: node --test scripts/ga4-weeks.test.mjs

      # No `npm ci`. Zero dependencies on purpose: a job that handles a service
      # -account private key should not also pull an install tree.
      - name: Pull GA4 weekly metrics
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: '415465396'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # A `schedule` event carries NO inputs, so `github.event.inputs.dry_run`
          # is empty and the `|| 'true'` fallback would make EVERY SCHEDULED RUN A
          # DRY RUN. The workflow would fire weekly, go green, print a table and
          # write nothing — a failure indistinguishable from success in the logs,
          # and only visible as metrics_ga4_weekly quietly not advancing.
          #
          # So the default is chosen by EVENT: a manual dispatch defaults to the
          # safe 'true' (the input's own default), and a scheduled run defaults to
          # 'false' because writing is the entire reason it is scheduled. Caught
          # while arming; the expression was correct for the dispatch-only world it
          # was written in. Work-list item 77.
          DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'schedule' && 'false' || 'true') }}
          WEEKS: ${{ github.event.inputs.weeks || '4' }}
        run: |
          # No `set -x`: this step holds a service-account private key and a
          # Supabase service-role key in env, and tracing would print both to a
          # log that outlives the run.
          set -eu
          node scripts/ga4-weekly-pull.mjs
