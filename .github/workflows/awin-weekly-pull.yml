name: awin weekly pull

# Weekly AWIN publisher performance into metrics_awin_weekly. Dashboard brief Step 4.
#
# Runs here rather than pg_cron-to-edge because AWIN_OAUTH_TOKEN lives in the Actions
# secret store and GitHub secrets are write-only by design.
#
# ARMED 15 AUGUST 2026, ACT 3, after acts 1 and 2 both passed:
#
#   1. dry_run = true  -> 93 rows printed across 12 weeks and 15 advertisers, pending and
#      confirmed showing a validation lag rather than zeroes.
#   2. dry_run = false -> "Upserted 93 rows into metrics_awin_weekly", verified in the
#      table: 993 clicks, 16 sales, GBP 527.72 value, realised commission 3.45%.
#   3. This diff. Arming is a change of its own so that "the schedule started running"
#      has a commit, a date and a reviewer, rather than arriving with the puller.
#
# 06:30 UTC MONDAY IS CHOSEN AGAINST THE IMPORT WINDOW, NOT ARBITRARILY. The nightly
# imports run 03:00-04:30 UTC. This reads api.awin.com and writes one metrics table; it
# touches no import path and shares no credential with one (AWIN_OAUTH_TOKEN, never
# AWIN_API_KEY). Monday rather than Sunday so the ISO week being re-pulled has closed.
#
# THE DRY_RUN DEFAULT IS EVENT-AWARE, AND THAT IS NOT COSMETIC. A manual dispatch defaults
# to DRY; a scheduled run defaults to WRITE. The defect this avoids was found when the GA4
# schedule was armed: a schedule that inherits the manual default runs dry forever, writes
# nothing, and reports success every week. A puller that never writes and never fails is
# indistinguishable from one that works until someone reads the table.

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = print only, false = write'
        required: false
        default: 'true'
      weeks:
        description: 'Trailing ISO weeks to re-pull (1-16)'
        required: false
        default: '12'
  schedule:
    # Mondays 06:30 UTC, after the ISO week has closed. A scheduled run WRITES: see the
    # event-aware DRY_RUN default below, which is the whole reason arming this is safe.
    - cron: '30 6 * * 1'

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull AWIN weekly performance
        env:
          # THE REPORTING CREDENTIAL. Never AWIN_API_KEY — that is the FEED credential,
          # read by eight live paths against productdata.awin.com, and overwriting it
          # breaks the nightly imports.
          AWIN_OAUTH_TOKEN: ${{ secrets.AWIN_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEEKS: ${{ github.event.inputs.weeks || '12' }}
          # Copied verbatim from ga4-weekly-pull.yml. Manual dispatch honours its input;
          # a scheduled run writes; anything else is dry.
          DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'schedule' && 'false' || 'true') }}
        run: node scripts/awin-weekly-pull.mjs
