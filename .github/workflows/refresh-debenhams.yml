name: refresh-debenhams

# Daily refresh of Debenhams beauty catalogue (retailer_id 28) from the AWIN
# multi-merchant datafeed.
#
# Why this exists: the full Debenhams feed is ~2.3M rows / ~4.85 GB uncompressed
# across 8 AWIN feed IDs. That OOMs the import-awin-feed edge worker
# (WORKER_RESOURCE_LIMIT). This Action downloads the raw feed here on a GitHub
# runner, filters it down to ~17K beauty rows (scripts/filter-debenhams-feed.py),
# uploads the filtered gzip to Supabase Storage, then triggers import-awin-feed.
#
# The function reads the filtered file via the storage:// URL scheme (v6.8):
# retailer_import_config.feed_url = 'storage://retailer-feeds/debenhams-beauty.csv.gz'.
# No migration or function change is needed — feed_format stays 'awin' and the
# function downloads from Storage with the service role, then parses as AWIN.
#
# Required GitHub secrets:
#   AWIN_API_KEY          - AWIN publisher API key (same value as the
#                           import-awin-feed edge function secret)
#   SUPABASE_PROJECT_REF  - crtrjoescntlcjiwdtrt
#   SUPABASE_SERVICE_KEY  - Supabase service role key (storage upload + function auth)

"on":
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Debenhams AWIN feed (8 feed IDs, combined gzip)
        env:
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
        run: |
          # Publisher 2841268, advertiser 22735 (Debenhams), all 8 beauty/general
          # feed IDs combined. Column set mirrors buildFeedUrl() in
          # import-awin-feed exactly so the parser maps every field it needs.
          # Nine feeds. 116972 "Debenhams Beauty" added 7 Aug 2026: Debenhams moved its
          # beauty catalogue out of the eight Fashion feeds into a dedicated feed some
          # time on 3-4 August, which halved the filtered output (12,623 -> 6,3xx) and
          # the guard below has refused every morning since, correctly.
          #
          # A ROTATION IS NOT A BREAKAGE, and it announced itself to nobody. AWIN does
          # not notify when an advertiser reorganises feed ids, and nothing here watches
          # the datafeed list for new ones. Second instance in five days (Gorgeous Shop
          # 110188 -> 116876 was the first). See work list item 42.
          #
          # THE EIGHT ARE KEPT. None is dead: all still import, all still serve their
          # own categories, and only beauty moved. Removing them would buy nothing and
          # would need reverting if beauty moves back.
          FIDS="90938,90940,90945,90947,91126,91133,91134,91135,116972"
          COLS="aw_deep_link,product_name,aw_product_id,merchant_product_id,search_price,store_price,merchant_deep_link,brand_name,rrp_price,in_stock,merchant_product_category_path,category_name,ean,mpn,merchant_image_url"
          curl -fsSL \
            "https://productdata.awin.com/datafeed/download/apikey/${AWIN_API_KEY}/fid/${FIDS}/format/csv/language/en/delimiter/%2C/compression/gzip/adultcontent/1/columns/${COLS}/" \
            -o raw.csv.gz
          ls -lah raw.csv.gz
          # Sanity: AWIN sometimes returns an HTML/JSON error with a 200. Confirm gzip magic.
          MAGIC=$(head -c 2 raw.csv.gz | xxd -p)
          if [ "$MAGIC" != "1f8b" ]; then
            echo "::error::Downloaded file is not gzip (magic=$MAGIC) — likely an AWIN error response"
            head -c 500 raw.csv.gz
            exit 1
          fi
          # Sanity: AWIN occasionally cuts the connection mid-stream and returns a
          # truncated-but-valid gzip (seen: 70 MB / 1.35M rows vs the usual
          # ~122 MB / 2.31M rows). That passed the row-floor below and silently
          # shipped a partial 3,858-row feed over the good one. Require the raw
          # download to be at least 100 MB so a truncated feed fails loudly.
          RAW_BYTES=$(stat -c%s raw.csv.gz)
          if [ "$RAW_BYTES" -lt 104857600 ]; then
            echo "::error::Raw feed is only $RAW_BYTES bytes (<100MB) — AWIN download likely truncated; not overwriting the good feed"
            exit 1
          fi

      - name: Filter to beauty rows
        run: |
          python3 scripts/filter-debenhams-feed.py raw.csv.gz debenhams-beauty.csv.gz
          ls -lah debenhams-beauty.csv.gz
          echo "Filtered feed has $(zcat debenhams-beauty.csv.gz | wc -l) lines (incl. header)"

      # Retain the filtered feed BEFORE the guard decides, so a REFUSED run still
      # leaves evidence. Added 5 Aug 2026, on the second consecutive failure.
      #
      # WHY THIS ORDERING IS THE WHOLE POINT. The guard exits non-zero, and the
      # Storage upload that used to be the only copy runs AFTER it. So on a failing
      # run the filtered feed was computed, inspected, and thrown away. Two mornings
      # were spent able to say the feed had shrunk by 50% and unable to say WHICH
      # products left, because the only artefact that could answer it existed for a
      # few seconds inside a runner.
      #
      # Storage still holds the last GOOD feed (3 Aug), which is the "before". This
      # supplies the "after" on every run, including refused ones. A failing run now
      # produces a diff rather than another partial answer.
      #
      # It does NOT weaken the guard: the guard is the next step and still stops the
      # import. This only means a refusal is now evidence rather than a dead end.
      - name: Retain filtered feed as an artefact (runs on pass AND on refusal)
        uses: actions/upload-artifact@v4
        with:
          name: debenhams-beauty-${{ github.run_id }}
          path: debenhams-beauty.csv.gz
          retention-days: 30
          if-no-files-found: error

      - name: Guard — refuse a suspiciously small filtered feed
        run: |
          # Guard against an over-narrow whitelist OR a truncated raw feed silently
          # shipping a partial catalogue. A full feed yields ~19.5K beauty rows; the
          # truncated download that shipped 3,858 rows must fail here too, so the
          # floor sits well above any plausible seasonal shrink but above 3,858.
          #
          # DO NOT LOWER THIS THRESHOLD. It was set against a stable 12,600-12,700 and
          # has now correctly refused twice, on 4 and 5 Aug 2026, against a real supply
          # change. Lowering it to let a run through would silence the only thing that
          # noticed. See migrations/README.md convention 11.
          #
          # ── UNCHANGED ON PURPOSE, 7 Aug 2026 ────────────────────────────────────
          # 116972 was added to FIDS above in the same commit as this comment, and the
          # floor was DELIBERATELY LEFT AT 12,000. One change per run: the nine-feed
          # fetch is the change being observed, and moving the threshold at the same
          # time would make tomorrow's result unattributable.
          #
          # The floor is expected to be wrong now, in the other direction, and that is
          # fine. The retention step above runs BEFORE this guard, so a refusal still
          # produces the artefact — which is the whole point of this run. The threshold
          # gets derived from that artefact, not from an estimate of it.
          #
          # ── WHEN THE THRESHOLD IS SET, IT IS NOT PERMANENT ──────────────────────
          # Whatever value replaces 12,000 will be calibrated on the POST-ROTATION
          # level. If Debenhams rotates again, the same trap recurs and a guard set
          # against today's baseline will refuse a legitimate future one.
          #
          # SO: AFTER ANY FEED ROTATION, THE GUARD'S BASIS MUST BE RE-DERIVED, NOT
          # DEFENDED. Two rotations in five days across two retailers (Gorgeous Shop
          # 110188 -> 116876, Debenhams into 116972) mean this is not hypothetical. The
          # failure mode is treating the number as settled because it was once argued
          # for. Re-derive it by diffing the current artefact against the previous good
          # one; the previous good copy lives in Supabase Storage and stays there while
          # the guard refuses, because a refusal skips the upload.
          ROWS=$(zcat debenhams-beauty.csv.gz | wc -l)
          if [ "$ROWS" -lt 12000 ]; then
            echo "::error::Filtered feed has only $ROWS lines (<12000) — whitelist too narrow or raw feed truncated"
            echo "The filtered feed HAS been retained as an artefact on this run; diff it against"
            echo "the last good copy in Supabase Storage (retailer-feeds/debenhams-beauty.csv.gz)."
            exit 1
          fi

      - name: Upload filtered feed to Supabase Storage
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -fsSL -X POST \
            "https://${PROJECT_REF}.supabase.co/storage/v1/object/retailer-feeds/debenhams-beauty.csv.gz" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Content-Type: application/gzip" \
            -H "x-upsert: true" \
            --data-binary "@debenhams-beauty.csv.gz" \
            -w "Storage upload HTTP %{http_code}\n"

      - name: Trigger import-awin-feed (LIVE — writes to catalogue)
        # Go-live: dry_run is false so the daily run applies the import (creates
        # new products, links retailer offers, updates prices). retailer 28 must
        # also have retailer_import_config.enabled = true or the function 400s.
        # Revert to "dry_run": true here to pause writes without disabling the cron.
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          RESPONSE=$(curl -fsSL -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/import-awin-feed" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            -d '{"retailer_id": 28, "dry_run": false}')
          echo "$RESPONSE" | head -c 4000
          echo ""
          # Accept both response shapes. Inline mode returns "feed_total_rows".
          # storage_passthrough mode (retailer 28 since the 23 Jun canary 2-6
          # migration) returns "staged":true from Phase A on success, then runs
          # Phase B/C asynchronously. Either is a successful trigger.
          echo "$RESPONSE" | grep -qE '"feed_total_rows"|"staged"[[:space:]]*:[[:space:]]*true' || {
            echo "::error::Import function did not return a successful result"
            exit 1
          }
