name: Work-list integrity

# THE LIST CARRIES REASONING FORWARD BY CITATION, AND UNTIL NOW THE CITATIONS WERE UNVERIFIED.
#
# Two checks, both of which existed only as scripts someone had to remember to type:
#   contiguity -- item numbers are unique and gapless. Catches an item written on a branch
#                 that never merged, which no diff shows because a diff shows what changed
#                 rather than what is absent.
#   citations  -- every item cited in the repository actually exists. On 24 August 2026 PR
#                 #410 shipped code citing "item 263" before item 263 was written; it was
#                 caught by accident, because the contiguity check refused item 264.
#
# THE CONTIGUITY CHECK WAS NEVER WIRED INTO CI. It caught the dangling citation only because
# someone ran it by hand while writing the next item. That is the check working and the
# process not.
#
# Runs on pull requests, because both failures are introduced by a branch and are cheapest to
# see before it merges.
#
# ── NO `paths:` FILTER, AND THAT IS THE POINT. Item 532. ──────────────────────────────────
#
# It had one, covering .ts, .tsx, .mts, .sql and .md. On 31 August 2026 PR #552 added a
# workflow and a Python script that cited item 531 twice before item 531 existed -- exactly
# the failure the citation check was written for, in PR #410's own words -- and the check
# DID NOT RUN, because .yml and .py were not in the list.
#
# THE CHECKER SCANS THE WHOLE REPOSITORY AND THE TRIGGER DID NOT. `check-worklist-citations.sh`
# greps every tracked file; run by hand on that branch it found both citations in a second.
# It was never asked.
#
#   A CHECK WHOSE SCOPE IS WIDER THAN ITS TRIGGER IS SILENT PRECISELY WHERE ITS TRIGGER IS
#   WRONG -- and nothing about a green pull request distinguishes "it passed" from "it never
#   ran". The path list was an optimisation on a job that takes well under a minute and needs
#   no secrets, so it was buying nothing and hiding the cases nobody had thought of.
#
# Same reasoning as retailer-logos.yml: a failure that can arrive without touching the
# filtered paths is silenced by a path filter in exactly the case the check exists for.

"on":
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Item numbers are contiguous and unique
        run: bash scripts/check-worklist-contiguity.sh
      - name: Every cited item exists
        run: bash scripts/check-worklist-citations.sh
